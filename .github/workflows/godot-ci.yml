name: Godot CI

# Runs on every push and PR — catches parse errors, missing autoloads, and
# broken fighter scale/spawn behavior before they land on main. This is the
# safety net for the slice-by-slice build: each slice's commit gets checked
# here automatically.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  headless-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Boot main scene (autoload + parse-error smoke test)
        run: |
          godot --headless --path . res://scenes/main_menu/main_menu.tscn --quit-after 60 \
            2>&1 | tee godot_boot.log || true
          ! grep -qE "SCRIPT ERROR|Parse Error|Invalid (call|assignment|get index)" godot_boot.log

      - name: Run headless slice tests
        run: |
          set -euo pipefail
          TESTS=(
            "res://scenes/test/test_spawn_validator.tscn"
            "res://scenes/test/test_hit_registration.tscn"
            "res://scenes/test/test_customization_warmup.tscn"
            "res://scenes/test/test_match_resolver.tscn"
            "res://scenes/test/test_match_start.tscn"
            "res://scenes/test/test_rep_pipeline.tscn"
            "res://scenes/test/test_shader_warmup.tscn"
            "res://scenes/test/test_crash_reporter.tscn"
            "res://scenes/test/test_input_command.tscn"
          )
          for scene in "${TESTS[@]}"; do
            echo "=== Running $scene ==="
            godot --headless --path . "$scene"
          done
